name: sim-e2e

# Phase 2 end-to-end CI: boots mesa engine, ticks 100 times, asserts non-trivial metrics.
# Acceptance criteria: PRD §4, SUB-01, task 1.3.
on:
  push:
    branches: [main]
    paths: ["simulation/**", ".github/workflows/sim-e2e.yml"]
  pull_request:
    paths: ["simulation/**", ".github/workflows/sim-e2e.yml"]
  # Daily smoke (PRD §4, SUB-05, task 5.4 coordination)
  schedule:
    - cron: '0 6 * * *'  # 6:00 AM UTC daily

jobs:
  mesa-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          # Install backend package first as simulation imports backend app schemas
          pip install -e ../backend
          pip install -e ".[dev]"

      - name: Mesa E2E — baseline run (100 ticks)
        run: python -m pytest tests/test_mesa_e2e.py -v --tb=short

      - name: Mesa E2E — calibration check
        run: python -m pytest tests/test_baseline_calibration.py -v --tb=short

      - name: Mesa E2E — DMRC schedule
        run: python -m pytest tests/test_dmrc_schedule.py -v --tb=short

      - name: Mesa E2E — bus bunching
        run: python -m pytest tests/test_bus_bunching.py -v --tb=short

      - name: Full simulation test suite
        run: python -m pytest -q
